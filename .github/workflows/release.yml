name: Build and Release

# Fires only when a version tag is pushed (e.g. v4.11).
# See RELEASING.md for the full release process.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
jobs:
  # ── 1. Compile sources and produce JLS.jar ──────────────────────────────────
  build-jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Derive version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: find the highest version tag; fall back to JLSInfo.java if none exist yet
            TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1)
            if [ -z "$TAG" ]; then
              VERS=$(grep -E 'public static final int vers\s*=' src/jls/JLSInfo.java | grep -oE '[0-9]+' | head -1)
              REL=$(grep -E 'public static final int release\s*=' src/jls/JLSInfo.java | grep -oE '[0-9]+' | head -1)
              TAG="v${VERS}.${REL}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "version=$(echo "$TAG" | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Compile Java sources
        run: |
          mkdir -p bin
          find src -name "*.java" > sources.txt
          # Compile targeting Java 8 (Java 21 dropped --release 7 support)
          javac -cp lib/jhall.jar -d bin @sources.txt

      - name: Copy resource files into output tree
        run: |
          # Eclipse treats resources/ as a source folder; copy non-Java files to bin/
          find resources -type f ! -name "*.java" | while IFS= read -r f; do
            dest="bin/${f#resources/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Package runnable JAR
        run: |
          mkdir -p staging
          # Extract jhall.jar, then overlay compiled classes on top
          cd staging && jar xf ../lib/jhall.jar && cd ..
          cp -r bin/. staging/
          # Remove any manifest baked into jhall.jar; ours will replace it
          rm -f staging/META-INF/MANIFEST.MF
          printf 'Main-Class: jls.JLS\n' > MANIFEST.MF
          jar cfm releases/JLS.jar MANIFEST.MF -C staging .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLS-jar
          path: releases/JLS.jar

  # ── 2. Build macOS app-image via jpackage ───────────────────────────────────
  #
  # Signing and notarization are both optional but recommended.
  # - Set MACOS_CERTIFICATE + MACOS_CERTIFICATE_PASSWORD to enable signing.
  # - Also set APPLE_ID + APPLE_TEAM_ID + APPLE_APP_PASSWORD to enable
  #   notarization, which eliminates the Gatekeeper "damaged" prompt entirely.
  # See RELEASING.md for setup details.
  build-macos:
    runs-on: macos-latest
    needs: build-jar
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARIZE: ${{ secrets.APPLE_ID != '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: JLS-jar
          # Drop into the existing contents/ dir alongside fileIcon.icns
          path: releases/macOS/contents

      - name: Import Developer ID certificate into temporary keychain
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 20)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Keep the keychain unlocked for the duration of the job (6 h)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/jpackage

          # Make the keychain searchable and allow codesign access without UI prompts
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build macOS app image (unsigned)
        working-directory: releases/macOS
        run: |
          # Build without --mac-sign: jpackage's signing doesn't pass
          # --options runtime to codesign, producing invalid signatures
          # that Apple's notary service rejects. We sign manually below.
          jpackage \
            --type app-image \
            --app-version "${{ needs.build-jar.outputs.version }}" \
            --description "J(ava) Logic Simulator" \
            --name "JLS" \
            --icon resources/JLS.icns \
            --resource-dir resources \
            --mac-package-identifier "info.siever.JLS" \
            --mac-package-name "JLS" \
            --file-associations associations.properties \
            --input contents \
            --main-jar JLS.jar \
            --main-class jls.JLS \
            --mac-app-category education

      - name: Sign macOS app with hardened runtime
        if: env.HAS_CERT == 'true'
        working-directory: releases/macOS
        run: |
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning \
            "$RUNNER_TEMP/build.keychain" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Signing with: $SIGNING_IDENTITY"

          # codesign --deep is deprecated and unreliable for jpackage bundles.
          # Sign explicitly from the inside out: nested binaries and sub-bundles
          # must be fully signed before the bundle that contains them.

          # 1. Sign all dylibs and shared libraries (include symlinks — many JRE
          #    libs in runtime/Contents/Home/lib/ are symlinked).
          find JLS.app \( -type f -o -type l \) \( -name "*.dylib" -o -name "*.so" \) | \
            while IFS= read -r f; do
              codesign --force --options runtime \
                --sign "$SIGNING_IDENTITY" \
                --timestamp "$f"
            done

          # 2. Sign Mach-O executables inside the bundled JRE (jspawnhelper,
          #    java, javac, etc.). Use `file` to identify actual Mach-O binaries
          #    and skip shell scripts, which codesign cannot sign.
          find JLS.app/Contents/runtime \( -type f -o -type l \) \
            ! -name "*.dylib" ! -name "*.so" ! -name "*.jar" | \
            while IFS= read -r f; do
              if file "$f" 2>/dev/null | grep -q "Mach-O"; then
                codesign --force --options runtime \
                  --sign "$SIGNING_IDENTITY" \
                  --timestamp "$f"
              fi
            done

          # 3. Sign the runtime sub-bundle as a bundle.
          #    runtime/ contains its own Contents/MacOS/ so codesign treats it as
          #    a nested bundle; it must be sealed before the outer app is signed,
          #    otherwise libjli.dylib and the main launcher get invalid signatures.
          codesign --force --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            JLS.app/Contents/runtime

          # 4. Sign the outer app bundle (must be last).
          #    --force is required: jpackage always adds an ad-hoc signature to the
          #    bundle even without --mac-sign, so codesign refuses without it.
          #    Do NOT sign Contents/MacOS/JLS explicitly beforehand — the outer
          #    bundle signing handles that with the entitlements file applied here.
          codesign --force --options runtime \
            --entitlements JLS.entitlements \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            JLS.app

          codesign --verify --deep --strict --verbose=2 JLS.app

      - name: Zip macOS app
        working-directory: releases/macOS
        run: zip -r JLS_macOS.zip JLS.app

      - name: Notarize and staple macOS app
        # Requires signing to have run first (HAS_CERT) and Apple credentials (HAS_NOTARIZE)
        if: env.HAS_CERT == 'true' && env.HAS_NOTARIZE == 'true'
        working-directory: releases/macOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Submit the signed zip to Apple's notary service and wait for approval.
          # Capture output so we can extract the submission ID and fetch the
          # rejection log if Apple returns status: Invalid.
          NOTARIZE_OUTPUT=$(xcrun notarytool submit JLS_macOS.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1)
          echo "$NOTARIZE_OUTPUT"

          if ! echo "$NOTARIZE_OUTPUT" | grep -q "status: Accepted"; then
            SUBMISSION_ID=$(echo "$NOTARIZE_OUTPUT" | grep -E '^\s+id:' | head -1 | awk '{print $2}')
            if [ -n "$SUBMISSION_ID" ]; then
              echo "--- Apple notarization rejection log ---"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD"
            fi
            exit 1
          fi

          # Staple the ticket so Gatekeeper accepts the app offline.
          # notarytool --wait returns once Apple approves, but the ticket
          # can take a few minutes to propagate to Apple's CDN. Retry up
          # to 5 times with a 30-second pause between attempts.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple JLS.app && break
            if [ "$attempt" = "5" ]; then echo "Stapling failed after 5 attempts" && exit 1; fi
            echo "Stapling attempt $attempt failed — waiting 30s for CDN propagation..."
            sleep 30
          done

          # Re-zip with the stapled app
          rm JLS_macOS.zip
          zip -r JLS_macOS.zip JLS.app

      - name: Remove temporary signing keychain
        # Always clean up, even if the build step failed
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLS-macOS
          path: releases/macOS/JLS_macOS.zip

  # ── 3. Build Windows app-image via jpackage ─────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: build-jar

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: JLS-jar
          # Drop into the existing contents/ dir alongside fileIcon.ico
          path: releases/windows/contents

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          # jpackage --type exe requires WiX candle.exe / light.exe.
          # WiX v3 is pre-installed on GitHub's Windows runner but not in PATH.
          $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory |
                    Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixDir) { throw "WiX Toolset not found on this runner" }
          "$($wixDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows installer
        working-directory: releases/windows
        shell: pwsh
        run: |
          # Windows version strings require Major.Minor.Patch; append .0
          jpackage `
            --type exe `
            --app-version "${{ needs.build-jar.outputs.version }}.0" `
            --description "J(ava) Logic Simulator" `
            --name "JLS" `
            --icon resources/JLS.ico `
            --file-associations associations.properties `
            --input contents `
            --main-jar JLS.jar `
            --main-class jls.JLS `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser

          # jpackage names the output JLS-<version>.exe; rename to a stable asset name
          Get-ChildItem -Filter "JLS-*.exe" | Rename-Item -NewName "JLS_windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLS-windows
          path: releases/windows/JLS_windows.exe


  # ── 4. Publish GitHub Release with all three assets ─────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [build-jar, build-macos, build-windows]
    permissions:
      contents: write
    env:
      NOTARIZED: ${{ secrets.APPLE_ID != '' }}

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release (notarized macOS build)
        if: env.NOTARIZED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "JLS ${{ needs.build-jar.outputs.version }}"
          body: |
            ## Downloads

            | File | Description |
            |------|-------------|
            | `JLS.jar` | Cross-platform runnable JAR (requires Java 8+) |
            | `JLS_macOS.zip` | macOS application bundle — unzip and double-click JLS.app |
            | `JLS_windows.exe` | Windows installer — double-click to install |
          files: |
            artifacts/JLS-jar/JLS.jar
            artifacts/JLS-macOS/JLS_macOS.zip
            artifacts/JLS-windows/JLS_windows.exe

      - name: Create GitHub Release (unsigned macOS build)
        if: env.NOTARIZED == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "JLS ${{ needs.build-jar.outputs.version }}"
          body: |
            ## Downloads

            | File | Description |
            |------|-------------|
            | `JLS.jar` | Cross-platform runnable JAR (requires Java 8+) |
            | `JLS_macOS.zip` | macOS application bundle — see note below before opening |
            | `JLS_windows.exe` | Windows installer — double-click to install |

            > **macOS note:** This build is not notarized. macOS Ventura and later will
            > report the app as "damaged". To fix, unzip, then run this command in Terminal
            > before opening the app:
            > ```
            > xattr -cr JLS.app
            > ```
            > See [RELEASING.md](../../blob/master/RELEASING.md) for how to set up signing
            > and notarization to eliminate this step.
          files: |
            artifacts/JLS-jar/JLS.jar
            artifacts/JLS-macOS/JLS_macOS.zip
            artifacts/JLS-windows/JLS_windows.exe
